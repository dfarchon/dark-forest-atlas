packages:
  - "."

saveExact: true
blockExoticSubdeps: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@rolldown/*"

# Direct deps follow package.json. Platform optional bindings
# (@esbuild/*, @oxlint/binding-*, @rolldown/binding-*, lightningcss-*)
# are pinned by their parent packages. glob-parent and picomatch each
# have two versions in the tree and are left to the lockfile.
overrides:
  react: "$react"
  react-dom: "$react-dom"
  "@types/node": "$@types/node"
  "@types/react": "$@types/react"
  "@types/react-dom": "$@types/react-dom"
  "@vitejs/plugin-react": "$@vitejs/plugin-react"
  autoprefixer: "$autoprefixer"
  netlify-cli: "$netlify-cli"
  oxlint: "$oxlint"
  postcss: "$postcss"
  tailwindcss: "$tailwindcss"
  tsx: "$tsx"
  typescript: "$typescript"
  vite: "$vite"
  "@alloc/quick-lru": 5.3.0
  "@jridgewell/gen-mapping": 0.3.13
